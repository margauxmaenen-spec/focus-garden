<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Focus Garden">
<meta name="theme-color" content="#eef5e9">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Focus Garden</title>
<style>
  :root{ --bg:#eef5e9; --bg2:#dcebd3; --ink:#24372a; --muted:#6c8270; --green:#4f9a5b; --green-d:#3a7a45; --card:#ffffffcc; --red:#c0533f; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overscroll-behavior:none}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;color:var(--ink);
    background:linear-gradient(180deg,#f6faf2 0%,var(--bg) 55%,var(--bg2) 100%);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  .app{position:fixed;inset:0;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 12px) 20px calc(env(safe-area-inset-bottom) + 12px)}
  .screen{display:none;flex:1;flex-direction:column;min-height:0}
  .screen.active{display:flex}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;gap:8px}
  h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.3px}
  .iconbtn{border:0;background:var(--card);border-radius:14px;padding:9px 13px;font-size:15px;color:var(--ink);font-weight:600;box-shadow:0 1px 3px #0001}
  .stage{flex:1;min-height:150px;display:flex;align-items:flex-end;justify-content:center;position:relative;padding:6px 0}
  .stage svg{height:100%;max-height:340px;width:100%;overflow:visible}
  .seedname{text-align:center;font-weight:600;font-size:18px;margin:4px 0 2px}
  .seeddesc{text-align:center;color:var(--muted);font-size:14px;margin-bottom:10px;min-height:18px}
  .seeds{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:4px 20px 10px}
  .seeds::-webkit-scrollbar{display:none}
  .seed{flex:0 0 auto;width:74px;height:86px;border-radius:18px;border:2px solid transparent;background:var(--card);
    display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;font-size:11px;color:var(--muted);box-shadow:0 1px 3px #0001;padding:5px 3px 6px;line-height:1.1;text-align:center}
  .seed svg{height:52px;width:64px}
  .seed.sel{border-color:var(--green);color:var(--ink);font-weight:600}
  .seg{display:flex;background:#dfe9d9;border-radius:14px;padding:3px;margin:4px 0 6px}
  .seg button{flex:1;border:0;background:transparent;border-radius:11px;padding:9px 0;font-size:15px;font-weight:600;color:var(--muted)}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px #0002}
  .dur{display:flex;align-items:baseline;justify-content:center;gap:6px;margin:6px 0 0}
  .dur b{font-size:38px;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums}
  .dur span{color:var(--muted);font-size:16px}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:40px;background:transparent;margin:0 0 12px}
  input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:8px;background:linear-gradient(90deg,var(--green) var(--fill,10%),#cfdcc9 var(--fill,10%))}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#fff;margin-top:-11px;box-shadow:0 2px 6px #0003;border:0}
  .primary{border:0;border-radius:20px;padding:17px;font-size:18px;font-weight:700;color:#fff;background:linear-gradient(180deg,#5aab66,var(--green-d));box-shadow:0 6px 16px #3a7a4555;width:100%}
  .primary:active{transform:scale(.98)}
  .ghost{border:0;background:transparent;color:var(--muted);font-size:15px;font-weight:600;padding:14px;width:100%}
  .countdown{text-align:center;font-size:56px;font-weight:700;letter-spacing:-1.5px;font-variant-numeric:tabular-nums;margin-top:8px}
  .hint{text-align:center;color:var(--muted);font-size:14px;line-height:1.4;margin:4px 12px 10px}
  .bar{height:6px;border-radius:6px;background:#cfdcc9;overflow:hidden;margin:6px 10px 8px}
  .bar i{display:block;height:100%;width:0;background:var(--green);transition:width .3s linear}
  .sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
  .wilt{filter:grayscale(.75) sepia(.7) brightness(.78)}
  .overlay{position:fixed;inset:0;background:#1d2b2066;display:none;align-items:flex-end;z-index:10}
  .overlay.show{display:flex}
  .sheet{background:#fbfdf9;width:100%;border-radius:26px 26px 0 0;padding:22px 22px calc(env(safe-area-inset-bottom) + 18px);text-align:center;animation:up .25s ease-out}
  @keyframes up{from{transform:translateY(40px);opacity:0}}
  .sheet h2{margin:4px 0 6px;font-size:22px}
  .sheet p{margin:0 0 16px;color:var(--muted);line-height:1.45}
  .sheet .stage{height:200px;flex:none}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0 12px}
  .stat{background:var(--card);border-radius:16px;padding:10px 6px;text-align:center;box-shadow:0 1px 3px #0001}
  .stat b{display:block;font-size:21px;font-variant-numeric:tabular-nums}
  .stat span{font-size:12px;color:var(--muted)}
  .plot{position:relative;width:100%;aspect-ratio:1;border-radius:20px;overflow:hidden;box-shadow:0 2px 10px #0002;touch-action:none}
  .plot svg{width:100%;height:100%;display:block}
  .banner{position:absolute;left:10px;right:10px;top:10px;background:#ffffffee;border-radius:14px;padding:10px 12px;font-size:14px;font-weight:600;
    text-align:center;box-shadow:0 2px 8px #0002;display:none;pointer-events:none}
  .banner.show{display:block}
  .gardenhint{text-align:center;color:var(--muted);font-size:13px;margin-top:12px;line-height:1.4}
</style>
</head>
<body>
<div class="app">

  <!-- HOME -->
  <section class="screen active" id="home">
    <header><h1>Focus Garden</h1><button class="iconbtn" id="toGarden">🌿 Garden</button></header>
    <div class="stage" id="preview"></div>
    <div class="seedname" id="seedName"></div>
    <div class="seeddesc" id="seedDesc"></div>
    <div class="seeds" id="seeds"></div>
    <div class="seg" id="where"><button data-pot="0">In the earth</button><button data-pot="1">In a pot</button></div>
    <div class="dur"><b id="durVal">25</b><span id="durUnit">min</span></div>
    <input type="range" id="dur" min="5" max="240" step="5" value="25">
    <button class="primary" id="start">Plant seed</button>
  </section>

  <!-- GROWING -->
  <section class="screen" id="grow">
    <div class="countdown" id="clock">25:00</div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="hint">Stay in the app while your plant grows.<br>Leave it and your plant dies.</div>
    <div class="stage" id="growStage"></div>
    <button class="ghost" id="giveUp">Give up</button>
  </section>

  <!-- GARDEN -->
  <section class="screen" id="garden">
    <header><button class="iconbtn" id="back">‹ Back</button><h1>My garden</h1><span style="width:70px"></span></header>
    <div class="stats">
      <div class="stat"><b id="stToday">0</b><span>min today</span></div>
      <div class="stat"><b id="stGrown">0</b><span>plants grown</span></div>
      <div class="stat"><b id="stTotal">0h</b><span>total focus</span></div>
    </div>
    <div class="plot" id="plot"><div id="plotSvg"></div><div class="banner" id="banner"></div></div>
    <div class="gardenhint" id="gardenHint">Hold a plant to move it.</div>
  </section>
</div>

<div class="overlay" id="confirm"><div class="sheet">
  <h2>Give up?</h2><p>Your plant will wither. It still goes in your garden, as a withered plant.</p>
  <button class="primary" id="keep">Keep focusing</button>
  <button class="ghost" id="reallyGiveUp" style="color:var(--red)">Give up</button>
</div></div>

<div class="overlay" id="result"><div class="sheet">
  <div class="stage" id="resultStage"></div>
  <h2 id="resTitle"></h2><p id="resText"></p>
  <button class="primary" id="resOk">Place it in my garden</button>
</div></div>

<script src="garden.js"></script>
<script>
const $ = id => document.getElementById(id);
const GRACE_MS = 5000; // short grace for accidental swipes (e.g. notification centre)
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};

let seed = store.get('seed','sunflower'); if(!SEEDS[seed]) seed='sunflower';
let usePot = store.get('pot',false);
let minutes = store.get('minutes',25);
let session = store.get('session',null);
let ticker=null, wakeLock=null, audioCtx=null;

// history: one entry per session: {id, seed, pot, ok, p, minutes, focused, start, at, x, y}
let history = store.get('history',[]);
history.forEach((h,i)=>{ if(h.id==null) h.id = h.start||i; if(h.x===undefined){ h.x=null; h.y=null; } });
const saveHistory = ()=> store.set('history',history);

function fmtDur(m){ if(m<60) return [m,'min']; const h=Math.floor(m/60), r=m%60; return r?[`${h}:${String(r).padStart(2,'0')}`,'hours']:[h,h===1?'hour':'hours']; }
function fmtClock(ms){ const t=Math.max(0,Math.ceil(ms/1000)), h=Math.floor(t/3600), m=Math.floor(t%3600/60), s=t%60, pad=n=>String(n).padStart(2,'0');
  return h?`${h}:${pad(m)}:${pad(s)}`:`${pad(m)}:${pad(s)}`; }
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id)); }

/* ---------- home ---------- */
function renderSeeds(){
  $('seeds').innerHTML = Object.keys(SEEDS).map(k=>`<button class="seed ${k===seed?'sel':''}" data-seed="${k}">${closeupSVG(k,1,{pot:usePot,sway:false})}${SEEDS[k].name}</button>`).join('');
  $('preview').innerHTML = closeupSVG(seed,1,{pot:usePot});
  $('seedName').textContent = SEEDS[seed].name; $('seedDesc').textContent = SEEDS[seed].desc;
  document.querySelectorAll('#where button').forEach(b=> b.classList.toggle('on', (b.dataset.pot==='1')===usePot));
  $('where').style.visibility = SEEDS[seed].noPot ? 'hidden' : 'visible';
}
function renderDur(){ const [v,u]=fmtDur(minutes); $('durVal').textContent=v; $('durUnit').textContent=u; $('dur').value=minutes; $('dur').style.setProperty('--fill',((minutes-5)/235*100)+'%'); }
$('seeds').addEventListener('click', e=>{ const b=e.target.closest('.seed'); if(!b) return; seed=b.dataset.seed; store.set('seed',seed); renderSeeds(); });
$('where').addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return; usePot = b.dataset.pot==='1'; store.set('pot',usePot); renderSeeds(); });
$('dur').addEventListener('input', e=>{ minutes=+e.target.value; store.set('minutes',minutes); renderDur(); });

/* ---------- session ---------- */
function startSession(){
  unlockAudio(); const now=Date.now();
  session={seed, pot:usePot && !SEEDS[seed].noPot, minutes, start:now, end:now+minutes*60000, hiddenAt:null}; store.set('session',session);
  show('grow'); requestWake(); clearInterval(ticker); ticker=setInterval(tick,500); lastDrawn=-1; tick();
}
const progress = ()=> clamp((Date.now()-session.start)/(session.end-session.start));
let lastDrawn=-1;
function tick(){
  if(!session) return; const now=Date.now(), p=progress();
  $('clock').textContent = fmtClock(session.end-now); $('barFill').style.width=(p*100)+'%';
  const q=Math.round(p*400); if(q!==lastDrawn){ lastDrawn=q; $('growStage').innerHTML = closeupSVG(session.seed,p,{pot:session.pot}); }
  if(now>=session.end) finish(true);
}
function finish(ok, reason){
  if(!session) return; clearInterval(ticker); ticker=null; releaseWake();
  const s=session, p = ok?1:progress(), now=Date.now();
  history.push({id:now, seed:s.seed, pot:!!s.pot, ok, p:+p.toFixed(3), minutes:s.minutes,
    focused:Math.round((ok?s.minutes*60000:Math.min(now,s.end)-s.start)/60000), start:s.start, at:now, x:null, y:null});
  saveHistory(); session=null; store.del('session');
  const name = SEEDS[s.seed].name.toLowerCase();
  $('resultStage').innerHTML = closeupSVG(s.seed,p,{pot:s.pot,dead:!ok});
  if(ok){ $('resTitle').textContent='Fully grown! 🌱'; $('resText').textContent=`You stayed focused for ${fmtDur(s.minutes).join(' ')}. Choose a spot for your ${name} in the garden.`; chime(); }
  else { $('resTitle').textContent=`Your ${name} withered`; $('resText').textContent=(reason||'You gave up on this one.')+' It still gets a spot in your garden.'; }
  $('result').classList.add('show');
}
$('start').addEventListener('click', startSession);
$('giveUp').addEventListener('click', ()=> $('confirm').classList.add('show'));
$('keep').addEventListener('click', ()=> $('confirm').classList.remove('show'));
$('reallyGiveUp').addEventListener('click', ()=>{ $('confirm').classList.remove('show'); finish(false); });
$('resOk').addEventListener('click', ()=>{ $('result').classList.remove('show'); openGarden(); });

/* ---------- leaving the app kills the plant ---------- */
function onHide(){ if(session && session.hiddenAt==null){ session.hiddenAt=Date.now(); store.set('session',session); } }
function onShow(){
  if(!session) return;
  if(session.hiddenAt!=null){
    const away=Date.now()-session.hiddenAt;
    if(away>GRACE_MS){ finish(false,`You left the app for ${Math.round(away/1000)} seconds, so your plant died.`); return; }
    session.hiddenAt=null; store.set('session',session);
  }
  requestWake(); tick();
}
document.addEventListener('visibilitychange', ()=> document.hidden?onHide():onShow());
window.addEventListener('pagehide', onHide);
window.addEventListener('pageshow', ()=>{ if(!document.hidden) onShow(); });

async function requestWake(){ try{ if('wakeLock' in navigator && !wakeLock && session){ wakeLock=await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release',()=>{wakeLock=null;}); } }catch(e){} }
function releaseWake(){ try{ wakeLock&&wakeLock.release(); }catch(e){} wakeLock=null; }
function unlockAudio(){ try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)(); audioCtx.resume(); }catch(e){} }
function chime(){ if(!audioCtx) return; try{ const t0=audioCtx.currentTime;
  [523.25,659.25,783.99,1046.5].forEach((f,i)=>{ const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.type='sine'; o.frequency.value=f;
    g.gain.setValueAtTime(0,t0+i*.14); g.gain.linearRampToValueAtTime(.18,t0+i*.14+.02); g.gain.exponentialRampToValueAtTime(.001,t0+i*.14+1.2);
    o.connect(g).connect(audioCtx.destination); o.start(t0+i*.14); o.stop(t0+i*.14+1.3); }); }catch(e){} }

/* ---------- garden ---------- */
// movable garden pieces: the pond and the table set
let furniture = store.get('furniture', null);
if(!furniture || !furniture.find(f=>f.kind==='pond')) furniture = [{id:'pond',kind:'pond',x:78,y:214},{id:'bistro',kind:'bistro',x:205,y:97}];
const saveFurniture = ()=> store.set('furniture', furniture);
const pondItem = ()=> furniture.find(f=>f.kind==='pond');
const placed = ()=> history.filter(h=>SEEDS[h.seed] && h.x!=null);
const pending = ()=> history.filter(h=>SEEDS[h.seed] && h.x==null);
const allItems = ()=> furniture.concat(placed());
// older plants that ended up inside the pond move to its edge
placed().forEach(e=>{ const p=outOfPond(e.x,e.y,pondItem()); e.x=p.x; e.y=p.y; });

let lifted=null; // {entry, dx, dy, from:{x,y}} while moving something

function renderStats(){
  const today=new Date().toDateString(), ok=history.filter(h=>h.ok);
  $('stToday').textContent = ok.filter(h=>new Date(h.at).toDateString()===today).reduce((a,h)=>a+h.minutes,0);
  $('stGrown').textContent = ok.length;
  const total = ok.reduce((a,h)=>a+h.minutes,0);
  $('stTotal').textContent = total>=60 ? (total/60).toFixed(total%60?1:0)+'h' : total+'m';
}
let drawQueued=false;
function renderPlot(){
  if(drawQueued) return; drawQueued=true;
  requestAnimationFrame(()=>{ drawQueued=false; $('plotSvg').innerHTML = gardenSVG(allItems(), lifted&&lifted.entry.id); });
}
function hint(t){ $('gardenHint').textContent=t; }
function renderBanner(){
  const next = pending()[0];
  if(next){ const n=SEEDS[next.seed].name.toLowerCase();
    $('banner').textContent = next.ok ? `Tap the grass to plant your ${n}` : `Tap the grass to place your withered ${n}`; }
  $('banner').classList.toggle('show', !!next);
  hint(next ? 'Higher up is further back, so plants there look smaller.'
            : placed().length ? 'Hold a plant, the pond or the table to move it.' : 'Your garden is still empty. Plant your first seed to start growing.');
}
function openGarden(){ renderStats(); renderBanner(); renderPlot(); show('garden'); }
$('toGarden').addEventListener('click', openGarden);
$('back').addEventListener('click', ()=> show('home'));

function scenePt(ev){ const r=$('plot').getBoundingClientRect(); return {x:(ev.clientX-r.left)/r.width*260, y:(ev.clientY-r.top)/r.height*260}; }
// keep the whole item inside the garden (tall plants can't go all the way to the back)
function clampPos(x,y,e){
  x=clamp(x,6,254); y=clamp(y,40,254);
  while(y<254 && itemBox({...e,x,y}).y1<3) y+=1;
  return {x,y};
}
function itemAt(pt){
  const m=4, hit = allItems().filter(e=> e.kind!=='pond').filter(e=>{ const b=itemBox(e); return pt.x>=b.x1-m && pt.x<=b.x2+m && pt.y>=b.y1-m && pt.y<=b.y2+m; })
                   .sort((a,b)=>b.y-a.y)[0];
  if(hit) return hit;
  const pond=pondItem(); return inPond(pt.x,pt.y,pond) ? pond : null;
}
// is this spot allowed for the item?
function fits(e){
  const pond=pondItem();
  if(e.kind==='pond') return allItems().filter(o=>o!==e).every(o=> feet(o).every(([x,y])=>!inPond(x,y,e)));
  return feet(e).every(([x,y])=>!inPond(x,y,pond));
}
let press=null;
$('plot').addEventListener('pointerdown', ev=>{
  const pt=scenePt(ev); press={pt, id:ev.pointerId, timer:null};
  const target = pending().length ? null : itemAt(pt);
  if(target){
    press.timer = setTimeout(()=>{
      lifted={entry:target, dx:target.x-pt.x, dy:target.y-pt.y, from:{x:target.x,y:target.y}};
      try{ $('plot').setPointerCapture(press.id); }catch(e){}
      hint('Drag to move, let go to put it down.');
      renderPlot();
    }, 420);
  }
});
$('plot').addEventListener('pointermove', ev=>{
  if(!press) return; const pt=scenePt(ev);
  if(!lifted){ if(Math.hypot(pt.x-press.pt.x, pt.y-press.pt.y)>4) clearTimeout(press.timer); return; }
  const p=clampPos(pt.x+lifted.dx, pt.y+lifted.dy, lifted.entry); lifted.entry.x=+p.x.toFixed(1); lifted.entry.y=+p.y.toFixed(1); renderPlot();
});
function drop(){
  const e=lifted.entry; let msg=null;
  if(e.kind==='pond'){ if(!fits(e)){ e.x=lifted.from.x; e.y=lifted.from.y; msg="The pond can't go on top of plants or the table, so it went back."; } }
  else if(e.kind==='bistro'){ if(!fits(e)){ e.x=lifted.from.x; e.y=lifted.from.y; msg="The table set can't stand in the pond, so it went back."; } }
  else { const p=outOfPond(e.x,e.y,pondItem()); const q=clampPos(p.x,p.y,e); e.x=+q.x.toFixed(1); e.y=+q.y.toFixed(1); }
  lifted=null; saveHistory(); saveFurniture(); renderBanner(); if(msg) hint(msg); renderPlot();
}
function endPress(ev){
  if(!press) return; clearTimeout(press.timer);
  const pt=scenePt(ev), moved=Math.hypot(pt.x-press.pt.x, pt.y-press.pt.y);
  if(lifted) drop();
  else if(pending().length && moved<10){
    const e=pending()[0], p0=outOfPond(pt.x,pt.y,pondItem()), p=clampPos(p0.x,p0.y,e); e.x=+p.x.toFixed(1); e.y=+p.y.toFixed(1);
    saveHistory(); renderBanner(); renderPlot();
  }
  press=null;
}
$('plot').addEventListener('pointerup', endPress);
$('plot').addEventListener('pointercancel', ()=>{ if(press) clearTimeout(press.timer); if(lifted) drop(); press=null; });
$('plot').addEventListener('contextmenu', e=>e.preventDefault());

/* ---------- boot ---------- */
renderSeeds(); renderDur();
if(session) finish(false,'The app was closed while your plant was growing, so it died.');
else if(pending().length) openGarden();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
